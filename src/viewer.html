<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>gitdiff3d</title>
<style>
  :root { --bg:#080b11; --fg:#c9d4e2; --dim:#63718a; --add:#3ddc84; --del:#ff5c6c;
          --edge:#1e2836; --accent:#7dcfff; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:13px/1.5 "SF Mono",Menlo,Consolas,monospace; overflow:hidden; }
  canvas { display:block; }
  .panel { position:fixed; padding:11px 14px; background:rgba(10,14,20,.8);
    border:1px solid var(--edge); border-radius:9px; backdrop-filter:blur(7px);
    animation:rise .45s ease both; }
  #brand { top:16px; left:16px; }
  #brand h1 { margin:0; font-size:13px; letter-spacing:.16em; text-transform:uppercase; }
  #brand div { color:var(--dim); margin-top:3px; }
  #where { top:16px; left:50%; transform:translateX(-50%); text-align:center; white-space:nowrap; }
  #where .sym { color:var(--accent); }
  #where .meta { color:var(--dim); margin-top:3px; }
  #keys { bottom:74px; left:16px; color:var(--dim); animation-delay:.1s; }
  #keys b { color:var(--fg); font-weight:600; }
  #bar { position:fixed; left:16px; right:16px; bottom:16px; height:40px; display:flex;
    gap:8px; padding:6px; background:rgba(10,14,20,.8); border:1px solid var(--edge);
    border-radius:9px; backdrop-filter:blur(7px); }
  #transport { display:flex; gap:4px; flex:0 0 auto; }
  #transport button { all:unset; cursor:pointer; padding:0 10px; border-radius:5px;
    color:var(--dim); background:#16202c; font:inherit; line-height:26px;
    transition:color .15s, background .15s; }
  #transport button:hover { color:var(--fg); background:#1e2c3c; }
  #transport button.live { color:#08101a; background:var(--accent); font-weight:600; }
  #strip { display:flex; gap:3px; flex:1 1 auto; }
  #strip .seg { position:relative; flex:1 1 0; min-width:6px; border-radius:4px;
    background:#16202c; cursor:pointer; overflow:hidden; transition:background .15s; }
  #strip .seg:hover { background:#1e2c3c; }
  #strip .seg.on { outline:1px solid var(--accent); }
  #strip .seg .bar { position:absolute; inset:0; width:0; background:#24405c; }
  #strip .seg i { position:absolute; inset:auto 0 0 0; height:3px; }
  #strip .seg i.add { background:var(--add); } #strip .seg i.del { background:var(--del); }
  .add { color:var(--add); } .del { color:var(--del); } .dim { color:var(--dim); }
  @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; } }
  #where { animation:rise .45s ease both; }
</style>
</head>
<body>
<div class="panel" id="brand"><h1>gitdiff3d</h1><div id="label">loading...</div></div>
<div class="panel" id="where"><div class="path"></div><div class="meta"></div></div>
<div class="panel" id="keys">
  <b>space</b> pause &middot; <b>,</b>/<b>.</b> keystroke &middot; <b>&lt;</b>/<b>&gt;</b> whole line &middot;
  <b>b</b>/<b>r</b> rewind &middot;
  <b>&rarr;</b>/<b>&larr;</b> hunk &middot; <b>x</b>/<b>X</b> speed &middot; <b>a</b> autoplay<br>
  every change is typed out: <span class="del">removals erase</span>,
  <span class="add">additions type in</span>
</div>
<div id="bar">
  <div id="transport">
    <button data-act="rewind">rewind</button>
    <button data-act="back" title="one keystroke back, shift-click for a whole line">back</button>
    <button data-act="toggle">pause</button>
    <button data-act="forward" title="one keystroke on, shift-click for a whole line">fwd</button>
    <button data-act="rate">1x</button>
  </div>
  <div id="strip"></div>
</div>
<script src="vendor/three.min.js"></script>
<script>
/* ---------- text metrics: world units follow the glyph advance ---------- */
const FONT_PX = 32, CANVAS_H = 44, CH = 0.135, THICK = 0.07, GUTTER = 6;

const probe = document.createElement("canvas").getContext("2d");
probe.font = FONT_PX + "px Menlo, monospace";
const ADVANCE = probe.measureText("0").width;
const PLATE_H = (CH * CANVAS_H) / ADVANCE;
const ROW = PLATE_H * 1.32;

const PALETTE = { keyword:"#7aa2ff", string:"#e0af68", comment:"#566a86",
  number:"#bb9af7", call:"#7dcfff", name:"#b8c6da", punct:"#8091a8" };

const KEYWORD = /^(?:const|let|var|function|func|fn|def|class|struct|interface|type|enum|impl|trait|module|end|return|if|elif|else|elseif|for|while|do|then|switch|case|break|continue|new|delete|await|async|import|export|from|use|package|public|private|protected|static|throw|try|catch|finally|yield|lambda|match|where|with|as|in|of|not|and|or|is|null|nil|None|True|False|true|false|this|self|super|pub|mut)$/;

const HASH_GRAMMAR = /(\s+)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(#.*|--.*)|(\b\d[\w.]*)|([A-Za-z_$][\w$]*)|([^\sA-Za-z0-9_$]+)/g;
const SLASH_GRAMMAR = /(\s+)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`(?:[^`\\]|\\.)*`)|(\/\/.*|\/\*.*)|(\b\d[\w.]*)|([A-Za-z_$][\w$]*)|([^\sA-Za-z0-9_$]+)/g;

function tokenize(line, language) {
  const grammar = language === "c-like" ? SLASH_GRAMMAR : HASH_GRAMMAR;
  const out = [];
  grammar.lastIndex = 0;
  let m;
  while ((m = grammar.exec(line)) !== null) {
    const [text, space, str, comment, num, word] = m;
    out.push({ text, colour:
      space ? PALETTE.name
      : str ? PALETTE.string
      : comment ? PALETTE.comment
      : num ? PALETTE.number
      : word ? (KEYWORD.test(word) ? PALETTE.keyword
          : line[m.index + text.length] === "(" ? PALETTE.call : PALETTE.name)
      : PALETTE.punct });
  }
  return out;
}

const SKIN = {
  ctx: { paper: "#0d131c", body: 0x18222f },
  del: { paper: "#1b1013", body: 0x7a2530 },
  add: { paper: "#0c1a13", body: 0x1f6b46 },
};

function paint(width, draw) {
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(width * ADVANCE));
  c.height = CANVAS_H;
  const g = c.getContext("2d");
  g.font = FONT_PX + "px Menlo, monospace";
  g.textBaseline = "middle";
  draw(g, c);
  const texture = new THREE.CanvasTexture(c);
  texture.anisotropy = 4;
  return texture;
}

const codeTexture = (kind, body, language) =>
  paint(Math.max(body.length, 1), (g, c) => {
    g.fillStyle = SKIN[kind].paper;
    g.fillRect(0, 0, c.width, c.height);
    let column = 0;
    for (const token of tokenize(body, language)) {
      g.fillStyle = token.colour;
      g.fillText(token.text, column * ADVANCE, c.height / 2);
      column += token.text.length;
    }
  });

const gutterTexture = (kind, number) =>
  paint(GUTTER, (g, c) => {
    g.fillStyle = "#0a0f16";
    g.fillRect(0, 0, c.width, c.height);
    g.fillStyle = kind === "add" ? "#3ddc84" : kind === "del" ? "#ff5c6c" : "#2c3a4a";
    g.fillText(kind === "add" ? "+" : kind === "del" ? "-" : " ", 0, c.height / 2);
    g.fillStyle = "#4b5b73";
    g.fillText(String(number === null ? "" : number).padStart(4), 1.6 * ADVANCE, c.height / 2);
  });

function plate(chars, texture, body) {
  const width = Math.max(0.4, chars * CH);
  const geometry = new THREE.BoxGeometry(width, PLATE_H, THICK);
  geometry.translate(width / 2, 0, 0);
  const face = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
  const rim = new THREE.MeshBasicMaterial({ color: body, transparent: true });
  return new THREE.Mesh(geometry, [rim, rim, rim, rim, face, rim]);
}

/* ---------- stage ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(44, 1, 0.1, 400);

const orbit = { theta: Math.PI / 2 - 0.4, phi: Math.PI / 2 - 0.15, radius: 26,
  target: new THREE.Vector3() };
const goal = { radius: 26, target: new THREE.Vector3() };

let drag = null;
renderer.domElement.addEventListener("pointerdown", (e) => (drag = { x: e.clientX, y: e.clientY }));
addEventListener("pointerup", () => (drag = null));
addEventListener("pointermove", (e) => {
  if (!drag) return;
  orbit.theta -= (e.clientX - drag.x) * 0.005;
  orbit.phi = Math.min(Math.PI - 0.12, Math.max(0.12, orbit.phi - (e.clientY - drag.y) * 0.005));
  drag = { x: e.clientX, y: e.clientY };
});
addEventListener("wheel", (e) => {
  goal.radius = Math.min(300, Math.max(4, goal.radius * (1 + Math.sign(e.deltaY) * 0.09)));
}, { passive: true });

/* ---------- the edit timeline: one entry per changed line ---------- */
const TYPE_MS = 16, ERASE_MS = 7, THINK_MS = 190, SETTLE_MS = 150, TAIL_MS = 900;

const indentOf = (text) => text.length - text.trimStart().length;
const bodyOf = (text) => text.slice(indentOf(text));

function timelineOf(hunk) {
  let at = 0;
  const edits = [];
  hunk.lines.forEach((line, key) => {
    if (line.kind === "ctx") return;
    const chars = Math.max(1, bodyOf(line.text).length);
    const per = line.kind === "add" ? TYPE_MS : ERASE_MS;
    const start = at + (line.kind === "add" ? THINK_MS : SETTLE_MS);
    const end = start + chars * per;
    at = end;
    edits.push({ key, kind: line.kind, start, end, chars, per });
  });
  const total = at + TAIL_MS;
  const keystrokes = [0];
  edits.forEach((edit) => {
    for (let i = 0; i <= edit.chars; i += 1) keystrokes.push(edit.start + i * edit.per);
  });
  keystrokes.push(total);
  return { edits, total, keystrokes, starts: [0, ...edits.map((e) => e.start), total] };
}

/* what the file looks like at time t: the layout falls out of hunk order */
function documentAt(hunk, timeline, t) {
  const state = new Map();
  timeline.edits.forEach((edit) => {
    const body = bodyOf(hunk.lines[edit.key].text);
    if (t >= edit.end) {
      state.set(edit.key, edit.kind === "add" ? { body, caret: null } : null);
    } else if (t <= edit.start) {
      state.set(edit.key, edit.kind === "add" ? null : { body, caret: null });
    } else {
      const struck = Math.min(edit.chars,
        Math.max(1, Math.ceil((t - edit.start) / edit.per - 1e-9)));
      const shown = edit.kind === "add" ? struck : edit.chars - struck;
      state.set(edit.key, shown <= 0 && edit.kind === "del"
        ? null
        : { body: body.slice(0, shown), caret: shown });
    }
  });

  const doc = [];
  hunk.lines.forEach((line, key) => {
    if (line.kind === "ctx") {
      doc.push({ key, kind: "ctx", indent: indentOf(line.text),
        body: bodyOf(line.text), caret: null, number: line.newNo });
      return;
    }
    const shown = state.get(key);
    if (shown === null) return;
    doc.push({ key, kind: line.kind, indent: indentOf(line.text), body: shown.body,
      caret: shown.caret, number: line.kind === "del" ? line.oldNo : line.newNo });
  });
  return doc;
}

/* ---------- the live page: one keyed group per visible line ---------- */
const live = new Map();
const page = new THREE.Group();
scene.add(page);

const caret = new THREE.Mesh(
  new THREE.BoxGeometry(CH * 0.16, PLATE_H * 0.9, THICK * 1.4),
  new THREE.MeshBasicMaterial({ color: 0x9fe8ff, transparent: true }));
caret.visible = false;
page.add(caret);

function makeLine(entry, language) {
  const group = new THREE.Group();
  const gutter = plate(GUTTER, gutterTexture(entry.kind, entry.number), SKIN[entry.kind].body);
  gutter.position.x = -(GUTTER + 1.2) * CH;
  group.add(gutter);
  page.add(group);
  const held = { group, gutter, code: null, body: null, y: null };
  refreshCode(held, entry, language);
  return held;
}

function refreshCode(held, entry, language) {
  if (held.body === entry.body) return;
  if (held.code) {
    held.group.remove(held.code);
    held.code.geometry.dispose();
    held.code.material.forEach((m) => { if (m.map) m.map.dispose(); m.dispose(); });
  }
  const code = plate(entry.body.length, codeTexture(entry.kind, entry.body, language),
    SKIN[entry.kind].body);
  code.position.x = entry.indent * CH;
  held.group.add(code);
  held.code = code;
  held.body = entry.body;
}

function drop(held) {
  page.remove(held.group);
  held.group.traverse((child) => {
    if (child.geometry) child.geometry.dispose();
    const materials = Array.isArray(child.material) ? child.material : [child.material];
    materials.forEach((m) => { if (!m) return; if (m.map) m.map.dispose(); m.dispose(); });
  });
}

function syncPage(doc, language, typing, live_caret) {
  const seen = new Set();
  doc.forEach((entry, row) => {
    seen.add(entry.key);
    const held = live.get(entry.key) || makeLine(entry, language);
    live.set(entry.key, held);
    refreshCode(held, entry, language);
    const target = -row * ROW;
    held.y = held.y === null ? target : held.y + (target - held.y) * 0.28;
    held.group.position.y = held.y;
    if (entry.caret !== null) {
      caret.position.set((entry.indent + entry.caret) * CH + CH * 0.1, held.y, THICK);
    }
  });
  caret.visible = live_caret;
  caret.material.opacity = typing && doc.some((entry) => entry.caret !== null)
    ? 1
    : 0.25 + 0.6 * Math.sin(performance.now() / 260) ** 2;
  [...live.keys()].forEach((key) => {
    if (seen.has(key)) return;
    drop(live.get(key));
    live.delete(key);
  });
}

/* ---------- transport ---------- */
const RATES = [0.25, 0.5, 0.7, 1, 2.5, 6];
const NORMAL = RATES.indexOf(1);
let data = null;
let at = 0;
let clock = 0;
let speed = 1;
let rate = NORMAL;
let auto = false;
let hunk = null;
let timeline = null;
let framing = { width: 10 };

const transport = document.getElementById("transport");
const button = (act) => transport.querySelector('[data-act="' + act + '"]');

const EPSILON = 0.5;

const seek = (direction, coarse) => {
  const marks = coarse ? timeline.starts : timeline.keystrokes;
  clock = direction < 0
    ? (marks.filter((mark) => mark < clock - EPSILON).pop() ?? 0)
    : (marks.find((mark) => mark > clock + EPSILON) ?? timeline.total);
  setSpeed(0);
};

const ACTIONS = {
  rewind: () => { clock = 0; },
  toggle: () => setSpeed(speed > 0 ? 0 : 1),
  back: (coarse) => seek(-1, coarse),
  forward: (coarse) => seek(1, coarse),
  rate: (step) => setRate(rate + (step || 1)),
};

function setRate(next) {
  rate = (next + RATES.length) % RATES.length;
  button("rate").textContent = RATES[rate] + "x";
  button("rate").classList.toggle("live", rate !== NORMAL);
}

function setSpeed(value) {
  speed = value;
  button("toggle").textContent = speed > 0 ? "pause" : "play";
  button("toggle").classList.toggle("live", speed === 0);
}

transport.querySelectorAll("button").forEach((element) => {
  element.onclick = (e) => { ACTIONS[element.dataset.act](e.shiftKey); e.currentTarget.blur(); };
});

/* ---------- hunks ---------- */
function goto(index) {
  at = (index + data.hunks.length) % data.hunks.length;
  hunk = data.hunks[at];
  timeline = timelineOf(hunk);
  clock = 0;
  setSpeed(speed > 0 ? 1 : 0);
  [...live.values()].forEach(drop);
  live.clear();
  const widest = Math.max(...hunk.lines.map((line) => line.text.length), 24);
  framing = { width: widest * CH, centre: (widest * CH) / 2 - GUTTER * CH };
  describe();
}

function describe() {
  const file = data.files[hunk.file];
  document.querySelector("#where .path").innerHTML =
    file.path + (hunk.symbol ? " <span class='sym'>" + hunk.symbol + "</span>" : "");
  document.querySelector("#where .meta").innerHTML =
    "hunk " + hunk.index + " / " + data.totals.hunks +
    " &middot; line " + hunk.newStart +
    " &middot; <span class='add'>+" + hunk.additions + "</span>" +
    " <span class='del'>-" + hunk.deletions + "</span>" +
    " &middot; " + timeline.edits.length + " edits" +
    (hunk.comment ? " &middot; <span class='dim'>comment only</span>" : "") +
    (auto ? " &middot; <span class='sym'>autoplay</span>" : "");
  [...strip.children].forEach((seg, i) => seg.classList.toggle("on", i === at));
}

/* ---------- filmstrip ---------- */
const strip = document.getElementById("strip");

function buildStrip() {
  data.hunks.forEach((entry, i) => {
    const seg = document.createElement("div");
    seg.className = "seg";
    seg.title = data.files[entry.file].path + "  +" + entry.additions + " -" + entry.deletions;
    seg.style.flexGrow = String(Math.max(1, entry.lines.length));
    const bar = document.createElement("div");
    bar.className = "bar";
    const edge = document.createElement("i");
    edge.className = entry.additions >= entry.deletions ? "add" : "del";
    seg.append(bar, edge);
    seg.onclick = () => goto(i);
    strip.appendChild(seg);
  });
}

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener("resize", resize);
resize();

addEventListener("keydown", (e) => {
  if (e.key === " ") { e.preventDefault(); ACTIONS.toggle(); }
  else if (e.key === ",") ACTIONS.back(false);
  else if (e.key === ".") ACTIONS.forward(false);
  else if (e.key === "<") ACTIONS.back(true);
  else if (e.key === ">") ACTIONS.forward(true);
  else if (e.key === "b" || e.key === "r") ACTIONS.rewind();
  else if (e.key === "x") ACTIONS.rate(1);
  else if (e.key === "X") ACTIONS.rate(-1);
  else if (e.key === "ArrowRight" || e.key === "n") goto(at + 1);
  else if (e.key === "ArrowLeft" || e.key === "p") goto(at - 1);
  else if (e.key === "a") { auto = !auto; describe(); }
});

let last = performance.now();
function frame(now) {
  const dt = Math.min(50, now - last);
  last = now;
  clock = Math.min(timeline.total, Math.max(0, clock + dt * speed * RATES[rate]));
  if (auto && speed > 0 && clock >= timeline.total) goto(at + 1);

  const doc = documentAt(hunk, timeline, clock);
  syncPage(doc, data.files[hunk.file].language, speed > 0,
    clock > 0 && clock < timeline.total);

  const height = doc.length * ROW;
  goal.target.set(framing.centre, -height / 2 + ROW / 2, 0);
  goal.radius = Math.max(framing.width * 0.98, height * 1.34) + 6;
  orbit.radius += (goal.radius - orbit.radius) * 0.08;
  orbit.target.lerp(goal.target, 0.1);
  camera.position.set(
    orbit.target.x + orbit.radius * Math.sin(orbit.phi) * Math.cos(orbit.theta),
    orbit.target.y + orbit.radius * Math.cos(orbit.phi),
    orbit.target.z + orbit.radius * Math.sin(orbit.phi) * Math.sin(orbit.theta));
  camera.lookAt(orbit.target);

  const current = strip.children[at];
  if (current) current.firstChild.style.width = (clock / timeline.total) * 100 + "%";
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

fetch("scene.json").then((r) => r.json()).then((loaded) => {
  data = loaded;
  document.getElementById("label").innerHTML =
    data.meta.label + " &middot; " + data.totals.hunks + " hunks &middot; " +
    "<span class='add'>+" + data.totals.additions + "</span> " +
    "<span class='del'>-" + data.totals.deletions + "</span>";
  buildStrip();
  setRate(NORMAL);
  setSpeed(1);
  goto(0);
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
